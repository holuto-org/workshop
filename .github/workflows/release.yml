name: Release

on:
  push:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  checks:
    uses: ./.github/workflows/checks.yml

  package:
    needs: checks
    uses: ./.github/workflows/package.yml
    secrets:
      SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}

  # Installers refuse downgrades, so a release needs a new workspace version.
  # A push that keeps an already released version builds and checks only.
  version:
    needs: package
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.v.outputs.tag }}
      new: ${{ steps.v.outputs.new }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - id: v
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="v$(python3 -c 'import tomllib; print(tomllib.load(open("Cargo.toml", "rb"))["workspace"]["package"]["version"])')"
          # Only "release not found" means unreleased; any other gh failure stops the run.
          if out=$(gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json tagName 2>&1); then
            new=false
          elif grep -q 'release not found' <<<"$out"; then
            new=true
          else
            echo "$out" >&2
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "new=$new" >> "$GITHUB_OUTPUT"
          echo "tag=$tag new=$new"

  # npm install scripts must never share the provenance signer's OIDC permission.
  sentry-release:
    needs: version
    if: needs.version.outputs.new == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Install Sentry CLI
        run: npm install --global @sentry/cli@3
      - name: Finalize Sentry release with commits
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ vars.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ vars.SENTRY_PROJECT }}
          SENTRY_URL: ${{ vars.SENTRY_URL }}
          TAG: ${{ needs.version.outputs.tag }}
        run: |
          release="workshop@${TAG#v}"
          sentry-cli releases new "$release"
          sentry-cli releases set-commits "$release" --auto
          sentry-cli releases finalize "$release"

  publish:
    needs: [version, sentry-release]
    if: needs.version.outputs.new == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v7
        with:
          pattern: package-*
          path: release
          merge-multiple: true
      - name: Stage version-matched installation instructions
        run: cp scripts/install.sh scripts/install.ps1 docs/install-with-ai.md release/
      - name: Checksums
        working-directory: release
        run: |
          sha256sum workshop-* install.sh install.ps1 install-with-ai.md > SHA256SUMS.txt
          sha256sum -c SHA256SUMS.txt
      - name: Attest release assets
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: release/*
      - env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.version.outputs.tag }}
        run: >
          gh release create "$TAG" release/*
          --repo "$GITHUB_REPOSITORY"
          --target "$GITHUB_SHA"
          --title "$TAG"
          --generate-notes
