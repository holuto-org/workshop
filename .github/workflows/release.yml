name: Release

on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - Cargo.toml

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.v.outputs.tag }}
      new: ${{ steps.v.outputs.new }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - id: v
        env:
          GH_TOKEN: ${{ github.token }}
          BASE: ${{ github.event.before || 'HEAD^' }}
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          import os
          import pathlib
          import re
          import subprocess
          import tomllib

          def version(value):
              if not re.fullmatch(r"[0-9]+\.[0-9]+\.[0-9]+", value):
                  raise ValueError(f"Release versions must be MAJOR.MINOR.PATCH: {value}")
              return tuple(map(int, value.split(".")))

          current = tomllib.loads(pathlib.Path("Cargo.toml").read_text())["workspace"]["package"]["version"]
          current_version = version(current)
          new = False
          if os.environ["GITHUB_EVENT_NAME"] == "push":
              base = os.environ["BASE"]
              previous = None
              if base.strip("0"):
                  old = subprocess.run(["git", "show", f"{base}:Cargo.toml"], capture_output=True, text=True)
                  # The initial Rust cutover has no Cargo.toml in the previous revision.
                  if old.returncode == 0:
                      previous = version(tomllib.loads(old.stdout)["workspace"]["package"]["version"])
              if previous is None or current_version > previous:
                  pages = json.loads(subprocess.check_output([
                      "gh", "api", "--paginate", "--slurp",
                      f"repos/{os.environ['GITHUB_REPOSITORY']}/releases",
                  ], text=True))
                  published = [
                      version(release["tag_name"][1:])
                      for page in pages for release in page
                      if not release["draft"] and not release["prerelease"]
                      and re.fullmatch(r"v[0-9]+\.[0-9]+\.[0-9]+", release["tag_name"])
                  ]
                  new = all(current_version > released for released in published)
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              output.write(f"tag=v{current}\nnew={str(new).lower()}\n")
          print(f"tag=v{current} new={new}")
          PY

  test:
    needs: version
    if: needs.version.outputs.new == 'true' || github.event_name == 'workflow_dispatch'
    uses: ./.github/workflows/checks.yml

  build:
    needs: [version, test]
    if: needs.version.outputs.new == 'true' || github.event_name == 'workflow_dispatch'
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: win-x64, os: windows-latest }
          - { name: mac-arm64, os: macos-latest }
          - { name: mac-x64, os: macos-26-intel }
          - { name: linux-x64, os: ubuntu-latest }
          - { name: linux-arm64, os: ubuntu-24.04-arm }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Install pinned Rust toolchain
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          key: release-${{ matrix.name }}
      - name: Install Linux build and smoke-test dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq pkg-config libfontconfig1-dev xvfb xauth dbus-x11
      - name: Build native package
        run: bash packaging/build.sh
        shell: bash
      - if: runner.os == 'Linux'
        name: Install the package and make sure the app comes up
        shell: bash
        run: |
          sudo apt-get install -y -qq ./release/*.deb
          # A fresh runner has an empty state directory: no printer, nothing to print.
          status=0
          dbus-run-session -- xvfb-run -a timeout 10 holuto-fiscal || status=$?
          test "$status" -eq 124
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.name }}
          path: release/*
          if-no-files-found: error
          retention-days: 7

  checksums:
    needs: [version, build]
    if: needs.version.outputs.new == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v7
        with:
          path: release
          merge-multiple: true
      - name: Checksums
        working-directory: release
        run: |
          sha256sum holuto-fiscal-* > SHA256SUMS.txt
          sha256sum -c SHA256SUMS.txt
      - uses: actions/upload-artifact@v7
        with:
          name: checksums
          path: release/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: [version, checksums]
    if: github.event_name == 'push' && needs.version.outputs.new == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v7
        with:
          path: release
          merge-multiple: true
      - name: Verify checksums
        working-directory: release
        run: sha256sum -c SHA256SUMS.txt
      - env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.version.outputs.tag }}
        run: >
          gh release create "$TAG" release/*
          --repo "$GITHUB_REPOSITORY"
          --target "$GITHUB_SHA"
          --title "$TAG"
          --generate-notes
