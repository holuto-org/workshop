name: Release

on:
  push:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  checks:
    uses: ./.github/workflows/checks.yml

  package:
    name: Package (${{ matrix.name }})
    needs: checks
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: win-x64, os: windows-latest, target: x86_64-pc-windows-msvc }
          - { name: mac-arm64, os: macos-latest, target: aarch64-apple-darwin }
          - { name: mac-x64, os: macos-26-intel, target: x86_64-apple-darwin }
          # The .deb records the build host's glibc as its libc6 floor: keep it at Ubuntu 24.04.
          - { name: linux-x64, os: ubuntu-24.04, target: x86_64-unknown-linux-gnu }
          - { name: linux-arm64, os: ubuntu-24.04-arm, target: aarch64-unknown-linux-gnu }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    env:
      SENTRY_DSN: ${{ vars.SENTRY_DSN }}
      SENTRY_ENVIRONMENT: production

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - run: rustup toolchain install

      - uses: Swatinem/rust-cache@v2
        with:
          key: package-${{ matrix.target }}

      - name: Install Linux packaging and launch dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq pkg-config libfontconfig1-dev fonts-dejavu-core xvfb xauth dbus-x11 xdotool x11-utils desktop-file-utils binutils

      - name: Require the production telemetry configuration
        run: test -n "$SENTRY_DSN"

      - name: Build native package
        run: bash packaging/build.sh

      - name: Check standalone smoke isolation and diagnostics opt-out
        if: runner.os == 'Linux'
        run: |
          target_dir=$(cargo metadata --locked --no-deps --format-version 1 | jq -er '.target_directory')
          python3 packaging/test-smoke.py "$target_dir/release/workshop"

      - name: Verify package and launch main window
        run: bash packaging/verify.sh

      - name: Prove simulator cannot enter a release build
        run: |
          log=$(mktemp)
          if cargo build --locked --release -p workshop --features simulator >"$log" 2>&1; then
            cat "$log"
            echo 'Simulator release unexpectedly compiled' >&2
            exit 1
          fi
          cat "$log"
          grep -F 'The simulator feature is restricted to local debug builds.' "$log"
          rm "$log"

      - name: Install Sentry CLI
        run: npm install --global @sentry/cli@3

      - name: Upload native debug information and source context
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ vars.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ vars.SENTRY_PROJECT }}
        run: |
          test -n "$SENTRY_AUTH_TOKEN"
          sentry-cli debug-files upload --include-sources --wait packaging/build/symbols

      - uses: actions/upload-artifact@v7
        with:
          name: package-${{ matrix.name }}
          path: release/*
          if-no-files-found: error
          retention-days: 7

  # Installers refuse downgrades, so a release needs a new workspace version.
  # A push that keeps an already released version builds and checks only.
  version:
    needs: package
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.v.outputs.tag }}
      new: ${{ steps.v.outputs.new }}

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - id: v
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="v$(python3 -c 'import tomllib; print(tomllib.load(open("Cargo.toml", "rb"))["workspace"]["package"]["version"])')"
          # Only "release not found" means unreleased; any other gh failure stops the run.
          if out=$(gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json tagName 2>&1); then
            new=false
          elif grep -q 'release not found' <<<"$out"; then
            new=true
          else
            echo "$out" >&2
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "new=$new" >> "$GITHUB_OUTPUT"
          echo "tag=$tag new=$new"

  publish:
    needs: version
    if: needs.version.outputs.new == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/download-artifact@v7
        with:
          pattern: package-*
          path: release
          merge-multiple: true

      - name: Stage version-matched installation instructions
        run: cp scripts/install.sh scripts/install.ps1 docs/install-with-ai.md release/

      - name: Checksums
        working-directory: release
        run: |
          sha256sum workshop-* install.sh install.ps1 install-with-ai.md > SHA256SUMS.txt
          sha256sum -c SHA256SUMS.txt

      - name: Attest release assets
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: release/*

      - env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.version.outputs.tag }}
        run: >
          gh release create "$TAG" release/*
          --repo "$GITHUB_REPOSITORY"
          --target "$GITHUB_SHA"
          --title "$TAG"
          --generate-notes
