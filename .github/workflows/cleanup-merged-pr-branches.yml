name: Cleanup merged PR branches

on:
  pull_request:
    types: [closed]

permissions:
  contents: write

concurrency:
  group: cleanup-merged-pr-branches-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  delete-merged-branch:
    if: ${{ github.event.pull_request.merged == true && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref != github.event.repository.default_branch && github.event.pull_request.head.ref != 'test' && github.event.pull_request.head.ref != 'staging' && github.event.pull_request.head.ref != 'production' }}
    uses: holuto-org/api/.github/workflows/cleanup-merged-pr-branches.yml@development
