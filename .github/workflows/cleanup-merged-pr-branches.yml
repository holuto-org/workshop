name: Cleanup merged PR branches

on:
  pull_request:
    types: [closed]

permissions:
  contents: write

concurrency:
  group: cleanup-merged-pr-branches-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  delete-merged-branch:
    if: ${{ github.event.pull_request.merged == true && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref != github.event.repository.default_branch }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Delete merged source branch
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ github.event.pull_request.head.ref }}
        run: gh api --method DELETE "repos/$GITHUB_REPOSITORY/git/refs/heads/$BRANCH"
