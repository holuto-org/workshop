name: Checks

on:
  pull_request:
    branches: [master]
    types: [opened, synchronize, reopened, ready_for_review, edited]
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  static:
    name: Static analysis
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Install Rust toolchains
        run: |
          rustup toolchain install
          rustup toolchain install nightly-2026-10-06 --profile minimal --component rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          key: static
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny@0.20.2,cargo-shear@1.14.0
      - name: Install Linux build dependencies
        # fontique -> yeslogic-fontconfig-sys needs pkg-config and fontconfig headers.
        # winit/softbuffer dlopen their display libraries; no X11/Wayland dev packages.
        run: sudo apt-get update -qq && sudo apt-get install -y -qq pkg-config libfontconfig1-dev
      - name: Format
        run: cargo +nightly-2026-10-06 fmt --check
      - name: Clippy
        run: cargo clippy --locked --workspace --all-targets --all-features -- -D warnings
      - name: Dependency policy
        run: cargo deny --locked check
      - name: Unused dependencies
        run: cargo shear --deny-warnings
      - name: ShellCheck
        run: shellcheck packaging/*.sh

  test:
    name: Test suite (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Install pinned Rust toolchain
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest@0.9.149
      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq pkg-config libfontconfig1-dev
      - name: Run tests
        run: cargo nextest run --locked --workspace --all-features --no-fail-fast
        env:
          NEXTEST_PROFILE: ci
