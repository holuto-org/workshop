name: Checks

on:
  pull_request:
    branches: [master]
    types: [opened, synchronize, reopened, ready_for_review, edited]
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  static:
    name: Static analysis
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Ruff format
        uses: astral-sh/ruff-action@v4.1.0
        with:
          src: packages
          args: format --check --diff

      - name: Ruff check
        uses: astral-sh/ruff-action@v4.1.0
        with:
          src: packages
          args: check

      - name: ShellCheck
        run: shellcheck packages/desktop/build.sh

  test:
    name: Test suite (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@v10.1.0
        with:
          quiet: true
          enable-cache: true

      - name: Install Qt runtime
        if: runner.os == 'Linux'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq libegl1 libgl1 libfontconfig1 libxkbcommon0 libdbus-1-3 libglib2.0-0t64

      - name: Install dependencies
        run: uv sync --locked

      - name: Run tests
        run: uv run pytest
        env:
          QT_QPA_PLATFORM: offscreen
