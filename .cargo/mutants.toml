test_tool = "nextest"
all_features = true
test_workspace = true
# These are external-system fixtures, not production fiscal paths.
exclude_globs = [
    "crates/*/src/testing.rs",
    "crates/*/src/testing/**",
    "crates/*/src/simulator.rs",
    "crates/*/src/simulator/**",
    "crates/desktop/src/simulators.rs",
]
minimum_test_timeout = 180
additional_cargo_test_args = ["--profile", "mutants"]
exclude_re = [
    # Disjoint bits: shifted checksum value has a zero low nibble and digit < 16.
    'crates/novitus/src/frame\.rs:\d+:\d+: replace \| with \^ in decode',
    # Defense in depth: after the ten-digit guard, normalized Quantity is at most 11 bytes.
    'crates/novitus/src/receipt\.rs:73:87: replace > with (==|>=) in validate',
    # EventFilter::Breadcrumb and EventFilter::Log are disjoint bits: OR and XOR coincide.
    'crates/desktop/src/telemetry\.rs:86:41: replace \| with \^ in layer',
    # Defensive stop checks: without a Worker, reachable models are stopped; status_matches
    # then implies processing=false and connected=false. Keep both explicit safety checks.
    'crates/desktop/src/application\.rs:566:(37|59): replace && with \|\| in Application::finish_quit',
    # Defensive gate: every ready Elzab profile supports advances, in production and acceptance.
    'crates/elzab/src/receipt\.rs:37:8: delete ! in validate',
]
