[workspace]
members = ["crates/*"]
resolver = "3"

[workspace.package]
edition = "2024"
license = "MIT"
publish = false
repository = "https://github.com/holuto-org/workshop"
rust-version = "1.99"
# The release workflow tags `v<version>` when a push to master raises it.
version = "0.2.0"

# CI promotes warnings to errors; local builds remain unblocked.
[workspace.lints.rust]
ambiguous_negative_literals = "warn"
deprecated_in_future = "warn"
deref_into_dyn_supertrait = "warn"
impl_trait_redundant_captures = "warn"
let_underscore_drop = "warn"
macro_use_extern_crate = "warn"
meta_variable_misuse = "warn"
missing_debug_implementations = "warn"
non_ascii_idents = "warn"
redundant_imports = "warn"
redundant_lifetimes = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }
single_use_lifetimes = "warn"
trivial_casts = "warn"
trivial_numeric_casts = "warn"
unit_bindings = "warn"
unnameable_types = "warn"
unreachable_pub = "warn"
# `deny`, not `forbid`: Slint's generated UI code allows it internally. Handwritten crates forbid it.
unsafe_code = "deny"
unused_import_braces = "warn"
unused_lifetimes = "warn"
unused_macro_rules = "warn"
unused_qualifications = "warn"
unused_results = "warn"

[workspace.lints.clippy]
nursery = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
# Internal crates without published docs: error and panic sections would only repeat signatures.
missing_errors_doc = "allow"
missing_panics_doc = "allow"
# Would put #[must_use] on nearly every getter in internal code.
must_use_candidate = "allow"
# pub(crate) inside private modules states intent; this nursery lint just removes it.
redundant_pub_crate = "allow"
return_self_not_must_use = "allow"
# Suggests dropping the instance lock and journal guards early, which would unlock the printer.
significant_drop_tightening = "allow"

# Restriction lints. Fiscal code must not panic, lose an error cause or truncate a number.
absolute_paths = "warn"
allow_attributes = "warn"
allow_attributes_without_reason = "warn"
as_conversions = "warn"
clone_on_ref_ptr = "warn"
dbg_macro = "warn"
deref_by_slicing = "warn"
empty_drop = "warn"
empty_structs_with_brackets = "warn"
exit = "warn"
expect_used = "warn"
filetype_is_file = "warn"
# Money is integer grosze; a float anywhere near it is a bug.
float_arithmetic = "warn"
float_cmp_const = "warn"
fn_to_numeric_cast_any = "warn"
format_push_string = "warn"
get_unwrap = "warn"
if_then_some_else_none = "warn"
impl_trait_in_params = "warn"
indexing_slicing = "warn"
infinite_loop = "warn"
let_underscore_must_use = "warn"
let_underscore_untyped = "warn"
lossy_float_literal = "warn"
# Keeps the device or OS error that explains an uncertain fiscal outcome.
map_err_ignore = "warn"
mem_forget = "warn"
missing_assert_message = "warn"
mixed_read_write_in_expression = "warn"
mod_module_files = "warn"
multiple_inherent_impl = "warn"
mutex_atomic = "warn"
needless_raw_strings = "warn"
panic = "warn"
panic_in_result_fn = "warn"
partial_pub_fields = "warn"
print_stderr = "warn"
print_stdout = "warn"
pub_use = "warn"
rc_buffer = "warn"
rc_mutex = "warn"
redundant_type_annotations = "warn"
renamed_function_params = "warn"
rest_pat_in_fully_bound_structs = "warn"
same_name_method = "warn"
semicolon_outside_block = "warn"
string_lit_chars_any = "warn"
# Polish text: byte slicing a &str panics inside a multi-byte character.
string_slice = "warn"
suspicious_xor_used_as_pow = "warn"
tests_outside_test_module = "warn"
todo = "warn"
try_err = "warn"
undocumented_unsafe_blocks = "warn"
unimplemented = "warn"
unnecessary_safety_comment = "warn"
unnecessary_self_imports = "warn"
unneeded_field_pattern = "warn"
unreachable = "warn"
unused_result_ok = "warn"
unwrap_in_result = "warn"
unwrap_used = "warn"
verbose_file_reads = "warn"
# Journal and job states grow; a wildcard arm would silently accept the new one.
wildcard_enum_match_arm = "warn"

[workspace.dependencies]
agent = { path = "crates/agent" }
posnet = { path = "crates/posnet" }

# Durable atomic replace: directory fsync on Unix, `MoveFileExW(MOVEFILE_WRITE_THROUGH)` on Windows.
atomicwrites = "0.4.4"
jiff = { version = "0.2.38", features = ["serde"] }
# Windows state directory: `SHGetKnownFolderPath`, never the overridable `%LOCALAPPDATA%`.
known-folders = "1.4.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
# No libudev: 4.9 enumerates Linux ports from sysfs, so the .deb needs no udev library.
serialport = { version = "4.10.1", default-features = false }
# Test fixtures' temporary directories.
tempfile = "3.27.0"
thiserror = "2.0.21"
# rustls with the platform verifier: workshop PCs may trust a corporate CA the OS knows about.
ureq = { version = "3.5.0", default-features = false, features = ["json", "platform-verifier", "rustls"] }
url = "2.5.8"
uuid = { version = "1.29.0", features = ["serde"] }

# The software renderer runs without a GPU or OpenGL driver (RDP, VMs, old workshop PCs) and
# keeps the resident footprint lowest: FemtoVG on WGPU measured ~4× the memory with the window
# open and ~2.3× while hidden in the tray. `system-tray` provides SystemTrayIcon.
slint = { version = "1.18.1", default-features = false, features = [
    "accessibility",
    "backend-winit",
    "compat-1-2",
    "renderer-software",
    "std",
    "system-tray",
] }
winresource = "0.1.34"
# Linux tray-availability probe (StatusNotifierWatcher); Slint already builds it for its ksni tray
# and AccessKit AT-SPI backends, on the same async-io runtime.
zbus = { version = "5.14.0", default-features = false, features = ["async-io"] }

[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false
opt-level = 1

[profile.release]
codegen-units = 1
lto = "fat"
# An overflow in a grosze sum must stop the operation, never wrap into a wrong fiscal amount.
overflow-checks = true
strip = "symbols"
