# Needs the pinned nightly rustfmt (AGENTS.md › Verify); stable rustfmt ignores the unstable options.
edition = "2024"
hex_literal_case = "Upper"
match_block_trailing_comma = true
newline_style = "Unix"
use_field_init_shorthand = true

condense_wildcard_suffixes = true
error_on_line_overflow = true
error_on_unformatted = true
float_literal_trailing_zero = "Always"
imports_granularity = "Crate"
reorder_impl_items = true

# Deliberately off: they corrupt code or comments, or are not idempotent, on the pinned nightly.
# wrap_comments (rustfmt#6586, #6339, #6426), normalize_comments (#6631),
# normalize_doc_attributes (#3988), format_macro_matchers (#3960),
# format_code_in_doc_comments (#6015, #6612), format_strings (#4471, #5138),
# group_imports (#6195 with imports_granularity, which is the more valuable of the two).
