[package]
name = "workshop"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true
rust-version.workspace = true

[features]
simulator = ["posnet/simulator", "novitus/simulator", "elzab/simulator"]

[dependencies]
agent.workspace = true
atomicwrites.workspace = true
fiscal.workspace = true
elzab = { workspace = true, optional = true }
novitus = { workspace = true, optional = true }
posnet.workspace = true
jiff.workspace = true
slint = { workspace = true, features = ["unstable-winit-030"] }
thiserror.workspace = true
sentry.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
ureq.workspace = true
serde_json.workspace = true

[target.'cfg(target_os = "windows")'.dependencies]
windows-sys.workspace = true

[target.'cfg(all(unix, not(target_vendor = "apple")))'.dependencies]
zbus.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
objc2.workspace = true
objc2-app-kit.workspace = true

[build-dependencies]
winresource.workspace = true

[dev-dependencies]
uuid.workspace = true
i-slint-backend-testing.workspace = true
proptest.workspace = true
tempfile.workspace = true
agent = { workspace = true, features = ["testing"] }

[lints]
workspace = true

[package.metadata.cargo-shear]
# Included only by the macOS harness; other hosts cannot detect its dependency use.
ignored-paths = ["src/application/macos/tests.rs"]

[[test]]
name = "macos_quit"
path = "src/bin_tests/macos_quit.rs"
harness = false
