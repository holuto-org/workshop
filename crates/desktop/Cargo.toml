[package]
name = "workshop"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true
rust-version.workspace = true

[features]
simulator = ["posnet/simulator", "novitus/simulator", "elzab/simulator", "agent/testing", "dep:uuid"]

[dependencies]
agent.workspace = true
uuid = { workspace = true, optional = true }
fiscal.workspace = true
i18n.workspace = true
elzab = { workspace = true, optional = true }
novitus = { workspace = true, optional = true }
posnet = { workspace = true, optional = true }
jiff.workspace = true
slint = { workspace = true, features = ["unstable-winit-030"] }
sentry.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
ureq.workspace = true
serde_json.workspace = true

[target.'cfg(target_os = "windows")'.dependencies]
windows-registry.workspace = true

[target.'cfg(not(windows))'.dependencies]
atomicwrites.workspace = true

[target.'cfg(unix)'.dependencies]
async-signal.workspace = true
futures-lite.workspace = true

[target.'cfg(all(unix, not(target_vendor = "apple")))'.dependencies]
zbus.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
objc2.workspace = true
objc2-app-kit.workspace = true

[dev-dependencies]
i-slint-backend-testing.workspace = true
tempfile.workspace = true
agent = { workspace = true, features = ["testing"] }
posnet = { workspace = true, features = ["simulator"] }

[target.'cfg(target_os = "macos")'.dev-dependencies]
dispatch2.workspace = true
uuid.workspace = true

[lints]
workspace = true

[package.metadata.cargo-shear]
# Included only by the macOS harness; other hosts cannot detect its dependency use.
ignored-paths = ["src/application/macos/tests.rs"]

[[test]]
name = "macos_quit"
path = "src/bin_tests/macos_quit.rs"
harness = false
